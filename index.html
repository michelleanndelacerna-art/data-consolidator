<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      .selected-cell { background-color: #dbeafe; border: 2px solid #2563eb; font-weight: 600; }
      .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Dropdown Transitions */
      .dropdown-enter { opacity: 0; transform: scaleY(0.95); }
      .dropdown-enter-active { opacity: 1; transform: scaleY(1); transition: opacity 0.1s, transform 0.1s; }
      /* Custom Search Input Style */
      .search-input:focus + .search-icon { color: #2563eb; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden" onclick="closeGlobalDropdown(event)">

    <header class="bg-white border-b px-6 py-4 flex items-center justify-between shadow-sm z-10">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <i class="ph ph-database text-xl"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-700">Data Consolidator</h1>
      </div>
      <div class="flex gap-2">
         <button onclick="saveAllResolved()" id="bulkSaveBtn" class="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded shadow font-medium transition">
           <i class="ph ph-floppy-disk-back"></i> Save All Resolved
         </button>
         <button onclick="loadData()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded hover:bg-gray-50 text-sm font-medium transition">
           <i class="ph ph-arrows-clockwise"></i> Refresh
         </button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      
      <aside class="w-1/3 min-w-[350px] bg-white border-r flex flex-col z-0 relative">
        <div class="p-4 border-b bg-gray-50">
          <div class="mb-5">
            <div class="flex justify-between text-xs mb-1.5">
              <span class="font-bold text-gray-700 uppercase tracking-wider">Progress</span>
              <span class="font-mono text-blue-600 font-semibold" id="progressText">...</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
              <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>
          </div>

          <div class="relative group">
            <i class="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search Name or ID..." 
              class="w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              onkeyup="filterList()">
            <button onclick="clearSearch()" class="absolute right-2 top-2 p-1 text-gray-400 hover:text-gray-600 hidden group-focus-within:block hover:bg-gray-200 rounded">
               <i class="ph ph-x"></i>
            </button>
          </div>
          
          <div class="flex flex-col gap-2 mt-3">
            <label class="flex items-center gap-2 text-xs text-gray-600 cursor-pointer select-none hover:text-blue-600 transition">
              <input type="checkbox" id="hideSavedCheckbox" onchange="filterList()" class="rounded text-blue-600 focus:ring-blue-500">
              <span>Hide Saved Employees</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-orange-600 cursor-pointer select-none hover:text-orange-700 transition font-medium">
              <input type="checkbox" id="showConflictsCheckbox" onchange="filterList()" class="rounded text-orange-500 focus:ring-orange-500">
              <span>Show Conflicts Only</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-green-600 cursor-pointer select-none hover:text-green-700 transition font-medium">
              <input type="checkbox" id="showResolvedCheckbox" onchange="filterList()" class="rounded text-green-500 focus:ring-green-500">
              <span>Show Resolved Only</span>
            </label>
          </div>
        </div>

        <div class="border-b bg-white shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] relative group z-20">
             <button onclick="resetFilters()" title="Reset All Filters" 
                     class="absolute right-1 top-1 z-10 bg-white/90 p-1 rounded-full shadow border hover:bg-red-50 text-red-500 hidden group-hover:block">
                <i class="ph ph-funnel-x"></i>
             </button>
             <div id="filterContainer" class="flex gap-2 overflow-x-auto p-3 no-scrollbar pr-8"></div>
        </div>
        
        <div id="loadingState" class="flex flex-col items-center justify-center h-64 hidden">
          <div class="loader mb-4"></div>
          <p class="text-gray-500 text-sm">Scanning Sheets...</p>
        </div>

        <div id="employeeList" class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50/50 z-0" onscroll="closeGlobalDropdown()"></div>
      </aside>

      <main class="flex-1 bg-gray-100 p-6 overflow-y-auto relative" onscroll="closeGlobalDropdown()">
        <div id="emptyState" class="flex flex-col items-center justify-center h-full text-gray-400">
          <i class="ph ph-files text-6xl mb-4"></i>
          <p class="text-lg">Select an employee to merge data</p>
        </div>

        <div id="mergeInterface" class="hidden max-w-full mx-auto"> 
          <div class="flex justify-between items-end mb-4">
            <div>
              <h2 class="text-2xl font-bold text-gray-800" id="currentEmployeeName">...</h2>
              <p class="text-sm text-gray-500">Normalized ID: <span id="currentEmployeeID" class="font-mono text-blue-600">...</span></p>
            </div>
            <div class="flex gap-2">
               <button onclick="resetMerge()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg transition flex items-center gap-2" title="Reset all changes">
                 <i class="ph ph-arrow-counter-clockwise"></i> Reset
               </button>
               <button onclick="markResolved()" class="px-3 py-2 bg-green-100 hover:bg-green-200 text-green-700 text-sm font-semibold rounded-lg transition flex items-center gap-2" title="Mark as locally resolved">
                 <i class="ph ph-check"></i> Mark Resolved
               </button>
               <button onclick="autoResolve()" class="px-3 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 text-sm font-semibold rounded-lg transition flex items-center gap-2" title="Auto pick most frequent values">
                 <i class="ph ph-magic-wand"></i> Auto-Resolve
               </button>
               <span class="px-3 py-2 bg-yellow-100 text-yellow-700 rounded-full text-xs font-semibold flex items-center gap-1">
                 <i class="ph ph-warning"></i> Click cells
               </span>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm overflow-x-auto border">
            <table class="w-full text-left min-w-[800px] border-separate border-spacing-0">
              <thead id="tableHeader"></thead>
              <tbody id="compareTableBody" class="text-sm divide-y"></tbody>
            </table>
          </div>

          <div class="mt-6 flex justify-end gap-3">
            <button onclick="saveMerge()" id="saveBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition flex items-center gap-2">
              <i class="ph ph-check-circle"></i> Save to Master Database
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="globalDropdown" class="hidden fixed z-[9999] bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto w-[200px]"></div>

    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transform translate-y-20 transition duration-300 opacity-0 pointer-events-none z-50"></div>

    <div id="customModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all scale-95" id="modalContent">
            <div class="mb-4">
                <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mb-4"><i class="ph ph-warning text-2xl text-yellow-600"></i></div>
                <h3 class="text-lg font-bold text-gray-900">Confirm Overwrite</h3>
                <p class="text-sm text-gray-500 mt-2">This record is already saved in the Master Database. Are you sure you want to overwrite it?</p>
            </div>
            <div class="flex gap-3 justify-end">
                <button onclick="closeModal(false)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">Cancel</button>
                <button onclick="closeModal(true)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">Yes, Overwrite</button>
            </div>
        </div>
    </div>

    <script>
      let allData = [];
      let fields = [];
      let sourceNames = [];
      let currentRecord = null;
      let finalMergeState = {};
      let currentFilters = {};
      let fullFilterOptions = null;
      let modalCallback = null;
      let activeFilterField = null; 

      window.onload = () => { loadData(); loadFilters(); };

      function loadData() {
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('employeeList').innerHTML = '';
        google.script.run.withSuccessHandler(onDataLoaded).withFailureHandler(showError).getConsolidatedData(currentFilters);
      }

      function onDataLoaded(response) {
        allData = response.data;
        fields = response.headers;
        sourceNames = response.sourceNames;
        document.getElementById('loadingState').classList.add('hidden');
        updateStats();
        filterList();
      }

      function updateStats() {
        const total = allData.length;
        const saved = allData.filter(d => d.masterRecord).length;
        const percent = total === 0 ? 0 : Math.round((saved / total) * 100);
        document.getElementById('progressText').innerText = `${saved} / ${total} (${percent}%)`;
        document.getElementById('progressBar').style.width = `${percent}%`;
      }

      function loadFilters() {
        google.script.run.withSuccessHandler(data => {
          fullFilterOptions = data;
          renderFilterInputs();
        }).getFilterOptions();
      }

      function renderFilterInputs() {
        const container = document.getElementById('filterContainer');
        container.innerHTML = ''; 
        const filterKeys = ['Work Location', 'Division', 'Group', 'Department', 'Section'];
        
        filterKeys.forEach(field => {
            const wrapper = document.createElement('div');
            wrapper.className = 'relative min-w-[160px] shrink-0'; 

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = field; 
            input.value = currentFilters[field] || ''; 
            input.className = 'w-full text-xs p-2 pr-8 border border-gray-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 shadow-sm text-gray-600 font-medium cursor-pointer';
            input.id = `input-${field}`;
            
            input.onclick = (e) => { e.stopPropagation(); openGlobalDropdown(field, input); };
            input.oninput = (e) => { openGlobalDropdown(field, input, e.target.value); }; 

            const icon = document.createElement('i');
            icon.className = 'ph ph-caret-down absolute right-2 top-2.5 text-gray-400 pointer-events-none';
            
            wrapper.appendChild(input);
            wrapper.appendChild(icon);
            container.appendChild(wrapper);
        });
      }

      function openGlobalDropdown(field, inputEl, searchText = "") {
          activeFilterField = field;
          const globalDrop = document.getElementById('globalDropdown');
          
          const rect = inputEl.getBoundingClientRect();
          globalDrop.style.top = (rect.bottom + 5) + 'px';
          globalDrop.style.left = rect.left + 'px';
          globalDrop.style.width = rect.width + 'px';

          globalDrop.innerHTML = '';
          const items = getDependentOptions(field);

          if (!searchText) {
              const allOpt = document.createElement('div');
              allOpt.textContent = `All ${field}s`;
              allOpt.className = 'p-2 hover:bg-blue-50 text-xs cursor-pointer text-gray-500 italic border-b';
              allOpt.onclick = () => selectGlobalOption(field, '');
              globalDrop.appendChild(allOpt);
          }

          const lowerSearch = searchText.toLowerCase();
          let count = 0;
          items.forEach(opt => {
               if(opt === '---') {
                   if(!searchText) {
                       const sep = document.createElement('div');
                       sep.textContent = '--- Other ---';
                       sep.className = 'p-1 text-[10px] text-gray-400 font-bold text-center uppercase bg-gray-50';
                       globalDrop.appendChild(sep);
                   }
               } else {
                   if(opt.toLowerCase().includes(lowerSearch)) {
                       const item = document.createElement('div');
                       item.textContent = opt;
                       item.className = 'p-2 hover:bg-blue-50 text-xs cursor-pointer text-gray-700';
                       item.onclick = () => selectGlobalOption(field, opt);
                       globalDrop.appendChild(item);
                       count++;
                   }
               }
          });

          if(count === 0 && searchText) {
              globalDrop.innerHTML = '<div class="p-2 text-xs text-gray-400 italic">No matches</div>';
          }

          globalDrop.classList.remove('hidden');
      }

      function selectGlobalOption(field, value) {
         currentFilters[field] = value;
         document.getElementById(`input-${field}`).value = value;
         if (field === 'Division') { currentFilters['Group'] = ''; currentFilters['Department'] = ''; currentFilters['Section'] = ''; }
         else if (field === 'Group') { currentFilters['Department'] = ''; currentFilters['Section'] = ''; }
         else if (field === 'Department') { currentFilters['Section'] = ''; }
         
         renderFilterInputs(); 
         closeGlobalDropdown();
         loadData();
      }

      function closeGlobalDropdown(e) {
         if (!e || (e.target.id !== 'globalDropdown' && !e.target.closest('#globalDropdown'))) {
             document.getElementById('globalDropdown').classList.add('hidden');
         }
      }

      function getDependentOptions(field) {
        if (!fullFilterOptions) return [];
        if (field === 'Work Location') return fullFilterOptions.raw['Work Location'] || [];
        const hierarchy = fullFilterOptions.orgChart || [];
        const rawDataList = fullFilterOptions.raw[field] || [];
        
        let validOrgValues = new Set();
        hierarchy.filter(row => {
           if (field === 'Group' && currentFilters['Division'] && row.Division !== currentFilters['Division']) return false;
           if (field === 'Department' && ((currentFilters['Division'] && row.Division !== currentFilters['Division']) || (currentFilters['Group'] && row.Group !== currentFilters['Group']))) return false;
           if (field === 'Section' && ((currentFilters['Division'] && row.Division !== currentFilters['Division']) || (currentFilters['Group'] && row.Group !== currentFilters['Group']) || (currentFilters['Department'] && row.Department !== currentFilters['Department']))) return false;
           return true;
        }).forEach(row => { if (row[field]) validOrgValues.add(row[field]); });
        
        const sortedOrg = Array.from(validOrgValues).sort();
        const others = rawDataList.filter(val => !validOrgValues.has(val));
        return others.length > 0 ? [...sortedOrg, '---', ...others] : sortedOrg;
      }
      
      function resetFilters() { currentFilters = {}; renderFilterInputs(); loadData(); }
      function clearSearch() { document.getElementById('searchInput').value = ''; filterList(); }

      function filterList() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const hideSaved = document.getElementById('hideSavedCheckbox').checked; 
        const showConflicts = document.getElementById('showConflictsCheckbox').checked; 
        const showResolved = document.getElementById('showResolvedCheckbox').checked; 

        const filtered = allData.filter(d => {
          const matchesSearch = d.normalizedName.toLowerCase().includes(query) || d.normalizedId.includes(query);
          if (hideSaved && d.masterRecord) return false;
          if (showConflicts) { if (!detectGlobalConflict(d) || d.resolvedLocally) return false; }
          if (showResolved && !d.resolvedLocally) return false;
          return matchesSearch;
        });
        renderList(filtered);
      }

      function renderList(data) {
        const container = document.getElementById('employeeList');
        container.innerHTML = '';
        if(data.length === 0) { container.innerHTML = '<p class="p-4 text-center text-gray-400">No records found.</p>'; return; }

        data.forEach(item => {
          const srcCount = Object.keys(item.sources).length;
          const hasConflict = detectGlobalConflict(item) && !item.resolvedLocally;
          const card = document.createElement('div');
          card.className = `p-3 rounded border cursor-pointer hover:bg-blue-50 transition group bg-white border-l-4 ${hasConflict ? 'border-l-orange-400' : 'border-l-green-400'}`;
          card.onclick = () => selectEmployee(item, true);
          
          let statusBadge = '';
          if (item.masterRecord) statusBadge = '<span class="text-xs text-green-600 bg-green-100 px-2 py-0.5 rounded-full font-medium">✓ Saved</span>';
          else if (item.resolvedLocally) statusBadge = '<span class="text-xs text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full font-medium">✓ Resolved</span>';

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div><h3 class="font-semibold text-gray-800">${item.normalizedName} ${statusBadge}</h3><p class="text-xs text-gray-500 font-mono">${item.normalizedId}</p></div>
              <div class="flex gap-1">${sourceNames.map(src => `<div class="w-2 h-2 rounded-full ${item.sources[src.name] ? 'bg-blue-500' : 'bg-gray-200'}" title="${src.name}"></div>`).join('')}</div>
            </div>
            <div class="mt-2 flex justify-between items-center">
               <span class="text-[10px] text-gray-400 uppercase tracking-wide">${srcCount} Sources</span>
               ${hasConflict ? '<span class="text-[10px] text-orange-600 bg-orange-100 px-2 py-0.5 rounded">Conflict</span>' : ''}
            </div>`;
          container.appendChild(card);
        });
      }

      function selectEmployee(record, isInitialSelection = false) {
        currentRecord = record;
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('mergeInterface').classList.remove('hidden');
        document.getElementById('currentEmployeeName').innerText = record.normalizedName;
        document.getElementById('currentEmployeeID').innerText = record.normalizedId;
        
        if (isInitialSelection) {
            if (record.manualMergeData) {
                finalMergeState = { ...record.manualMergeData };
            } else if (record.masterRecord) {
                fields.forEach(field => finalMergeState[field] = record.masterRecord[field] || "");
            } else {
                fields.forEach(field => {
                   let val = "";
                   for (const src of sourceNames) { if (record.sources[src.name]?.[field]) { val = record.sources[src.name][field]; break; } }
                   finalMergeState[field] = val;
                });
            }
        }
        renderBody();
      }

      function renderBody() {
        const tbody = document.getElementById('compareTableBody');
        const thead = document.getElementById('tableHeader');
        
        let headerHtml = `<tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider"><th class="p-4 font-medium w-48 sticky left-0 bg-gray-50 z-10 border-r border-b">Field</th>`;
        const colors = ['text-blue-700 bg-blue-100/50', 'text-purple-700 bg-purple-100/50', 'text-green-700 bg-green-100/50'];
        
        sourceNames.forEach((src, index) => { 
            headerHtml += `<th class="p-4 font-medium ${colors[index % colors.length]} min-w-[200px] border-b group relative">
                            <a href="${src.url}" target="_blank" class="hover:underline flex items-center gap-1" title="Open Source Sheet">
                                ${src.name} <i class="ph ph-arrow-square-out text-xs opacity-50 group-hover:opacity-100"></i>
                            </a>
                           </th>`; 
        });
        
        headerHtml += `<th class="p-4 font-medium bg-gray-800 text-white min-w-[250px] sticky right-0 z-10 shadow-xl border-b">Final Merged Data</th></tr>`;
        thead.innerHTML = headerHtml;

        tbody.innerHTML = '';
        fields.forEach(field => {
          const values = sourceNames.map(src => currentRecord.sources[src.name]?.[field] || "");
          const nonEmpty = values.filter(v => v !== "");
          const isIdentical = nonEmpty.every(v => v === nonEmpty[0]);
          const row = document.createElement('tr');
          row.className = 'border-b';
          
          let cellsHtml = `<td class="p-4 font-medium text-gray-600 border-r sticky left-0 z-10 ${isIdentical ? 'bg-white' : 'bg-orange-50'}">${field}</td>`;
          sourceNames.forEach(src => { cellsHtml += renderCell(field, currentRecord.sources[src.name]?.[field] || ""); });
          cellsHtml += `<td class="p-4 border-l sticky right-0 z-10 ${isIdentical ? 'bg-white' : 'bg-orange-50'}"><input type="text" id="final-${field}" value="${finalMergeState[field] || ''}" onchange="updateFinal('${field}', this.value)" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 text-sm font-medium text-gray-900 bg-white shadow-inner"></td>`;
          row.innerHTML = cellsHtml;
          tbody.appendChild(row);
        });
      }

      function renderCell(field, value) {
        const values = sourceNames.map(src => currentRecord.sources[src.name]?.[field] || "");
        const nonEmpty = values.filter(v => v !== "");
        const isIdentical = nonEmpty.every(v => v === nonEmpty[0]);
        const baseBg = isIdentical ? 'bg-white' : 'bg-orange-50';
        if(!value) return `<td class="p-4 text-gray-300 italic text-xs border-r ${baseBg}">Missing</td>`;
        const isSelected = finalMergeState[field] === value;
        const safeValue = value.toString().replace(/'/g, "\\'");
        return `<td class="p-4 border-r cursor-pointer hover:bg-gray-100 transition relative group ${isSelected ? 'selected-cell' : baseBg}" onclick="handleCellClick('${field}', '${safeValue}')"><span class="block truncate max-w-[250px]" title="${value}">${value}</span><div class="hidden group-hover:flex absolute top-1 right-1 bg-white shadow rounded px-1 text-[10px] text-gray-500">Use</div></td>`;
      }

      function autoResolve() {
         fields.forEach(field => {
            const counts = {}; let maxVal = null; let maxCount = 0;
            sourceNames.forEach(src => {
                const val = currentRecord.sources[src.name]?.[field];
                if (val && val !== "N/A" && val !== "") {
                    const sVal = String(val); counts[sVal] = (counts[sVal] || 0) + 1;
                    if (counts[sVal] > maxCount) { maxCount = counts[sVal]; maxVal = sVal; }
                }
            });
            if (maxVal !== null) finalMergeState[field] = maxVal;
         });
         renderBody(); showToast("Auto-resolved all fields!");
      }
      
      function resetMerge() {
         if (!currentRecord) return;
         delete currentRecord.manualMergeData;
         delete currentRecord.resolvedLocally;
         selectEmployee(currentRecord, true); 
         filterList();
         showToast("Reset to original state.");
      }
      
      function markResolved() {
        if (!currentRecord) return;
        currentRecord.resolvedLocally = true;
        currentRecord.manualMergeData = { ...finalMergeState }; 
        filterList(); 
        showToast("Marked as resolved locally.");
      }

      function saveAllResolved() {
        const recordsToSave = allData.filter(d => !d.masterRecord && d.resolvedLocally).map(d => d.manualMergeData);
        if (recordsToSave.length === 0) { showToast("No 'Resolved' records found to save. Please mark records as resolved first."); return; }
        const btn = document.getElementById('bulkSaveBtn');
        const origText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = `<div class="loader w-4 h-4 border-white border-t-transparent"></div> Saving ${recordsToSave.length}...`;
        google.script.run.withSuccessHandler(res => { showToast(res.message); loadData(); btn.disabled = false; btn.innerHTML = origText; }).withFailureHandler(err => { alert("Error: " + err.message); btn.disabled = false; btn.innerHTML = origText; }).saveBulkToMaster(recordsToSave);
      }

      function handleCellClick(field, value) {
         if (currentRecord.masterRecord && finalMergeState[field] !== value) { showConfirmation(() => { finalMergeState[field] = value; renderBody(); }); } else { finalMergeState[field] = value; renderBody(); }
      }
      function updateFinal(field, value) {
         if (currentRecord.masterRecord) { showConfirmation(() => { finalMergeState[field] = value; }, () => { document.getElementById(`final-${field}`).value = finalMergeState[field]; }); } else { finalMergeState[field] = value; }
      }
      function showConfirmation(onYes, onNo = () => {}) {
         const modal = document.getElementById('customModal');
         modal.classList.remove('hidden'); modal.classList.add('flex');
         modalCallback = (confirmed) => { if (confirmed) onYes(); else onNo(); modal.classList.add('hidden'); modal.classList.remove('flex'); };
      }
      function closeModal(result) { if (modalCallback) modalCallback(result); }

      // --- FIX: Reset Button State After Save ---
      function saveMerge() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; 
        btn.innerHTML = `<div class="loader w-4 h-4 border-white border-t-transparent"></div> Saving...`;
        
        google.script.run.withSuccessHandler(res => {
            showToast(res.message); 
            loadData(); 
            document.getElementById('mergeInterface').classList.add('hidden'); 
            document.getElementById('emptyState').classList.remove('hidden');
            // FORCE RESET
            btn.disabled = false; 
            btn.innerHTML = `<i class="ph ph-check-circle"></i> Save to Master Database`;
        }).withFailureHandler(err => { 
            alert(err.message); 
            // FORCE RESET ON ERROR
            btn.disabled = false; 
            btn.innerHTML = `<i class="ph ph-check-circle"></i> Save to Master Database`;
        }).saveToMaster(finalMergeState);
      }

      function detectGlobalConflict(item) {
        let conflict = false;
        fields.forEach(f => {
          const vals = new Set();
          sourceNames.forEach(src => { if(item.sources[src.name]?.[f]) vals.add(item.sources[src.name][f]); });
          if(vals.size > 1) conflict = true;
        });
        return conflict;
      }
      function showToast(msg) { const el = document.getElementById('toast'); el.innerText = msg; el.classList.remove('translate-y-20', 'opacity-0'); setTimeout(() => { el.classList.add('translate-y-20', 'opacity-0'); }, 3000); }
      function showError(err) { alert("Error: " + err.message); document.getElementById('loadingState').classList.add('hidden'); }
    </script>
  </body>
</html>
